name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AVO_REFERENCE_DEVELOPMENT_METADATA_FILE: .avo-runtime/ci-development-metadata.json
      AVO_REFERENCE_ADMISSION_METADATA_FILE: .avo-runtime/ci-admission-metadata.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras --frozen
      - name: Validate authoritative roadmap
        run: >-
          uv run python .agents/skills/avo-roadmap/scripts/validate_roadmap.py
          docs/roadmap.md --max-review-age-days 45
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Build tier-separated evaluator images
        if: runner.os == 'Linux'
        run: |
          mkdir -p .avo-runtime
          docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.development --tag avo-reference-development:1.0.0 --metadata-file "$AVO_REFERENCE_DEVELOPMENT_METADATA_FILE" .
          docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.admission --tag avo-reference-admission:1.0.0 --metadata-file "$AVO_REFERENCE_ADMISSION_METADATA_FILE" .
      - name: Measure evaluator platform overhead
        if: runner.os == 'Linux'
        run: uv run avoctl platform benchmark
      - name: Run complete canonical suite with coverage
        if: runner.os == 'Linux'
        run: uv run pytest --cov=avo_correlate --cov-report=term
      - name: Run native Windows portability suite
        if: runner.os == 'Windows'
        run: >-
          uv run pytest
          --ignore tests/e2e/test_reference_scenario.py
          --ignore tests/integration/test_docker_evaluator.py
          --ignore tests/performance/test_platform_overhead.py
      - run: uv run python -m avo_correlate.devtools.export_schemas
      - name: Verify generated schemas are committed
        run: git diff --exit-code -- schemas

  windows-wsl-parity:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, Windows, X64, wsl2, docker]
    env:
      AVO_WSL_PROJECT_PATH: ${{ vars.AVO_WSL_PROJECT_PATH }}
      AVO_REFERENCE_DEVELOPMENT_METADATA_FILE: ${{ vars.AVO_WSL_PROJECT_PATH }}/.avo-runtime/ci-development-metadata.json
      AVO_REFERENCE_ADMISSION_METADATA_FILE: ${{ vars.AVO_WSL_PROJECT_PATH }}/.avo-runtime/ci-admission-metadata.json
      WSLENV: "AVO_REFERENCE_DEVELOPMENT_METADATA_FILE:AVO_REFERENCE_ADMISSION_METADATA_FILE"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sync canonical WSL environment
        shell: pwsh
        run: >-
          wsl.exe --cd $env:AVO_WSL_PROJECT_PATH --exec uv sync --all-groups --all-extras --frozen
      - name: Build development evaluator in WSL
        shell: pwsh
        run: >-
          wsl.exe --cd $env:AVO_WSL_PROJECT_PATH --exec docker buildx build
          --output=type=docker
          --platform=linux/amd64
          --provenance=false
          --build-arg SOURCE_DATE_EPOCH=0
          --file evaluators/reference/Dockerfile.development
          --metadata-file $env:AVO_REFERENCE_DEVELOPMENT_METADATA_FILE
          --tag avo-reference-development:1.0.0 .
      - name: Build admission evaluator in WSL
        shell: pwsh
        run: >-
          wsl.exe --cd $env:AVO_WSL_PROJECT_PATH --exec docker buildx build
          --output=type=docker
          --platform=linux/amd64
          --provenance=false
          --build-arg SOURCE_DATE_EPOCH=0
          --file evaluators/reference/Dockerfile.admission
          --metadata-file $env:AVO_REFERENCE_ADMISSION_METADATA_FILE
          --tag avo-reference-admission:1.0.0 .
      - name: Measure WSL evaluator platform overhead
        shell: pwsh
        run: .\scripts\avoctl.ps1 platform benchmark
      - name: Run full parity and recovery suite through wrapper
        shell: pwsh
        run: .\scripts\avoctl.ps1 test parity
      - name: Run complete canonical suite
        shell: pwsh
        run: >-
          wsl.exe --cd $env:AVO_WSL_PROJECT_PATH --exec uv run pytest
          --cov=avo_correlate --cov-report=term
