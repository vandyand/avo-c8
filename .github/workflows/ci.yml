name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AVO_REFERENCE_DEVELOPMENT_METADATA_FILE: .avo-runtime/ci-development-metadata.json
      AVO_REFERENCE_ADMISSION_METADATA_FILE: .avo-runtime/ci-admission-metadata.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --all-extras --frozen
      - name: Validate authoritative roadmap
        run: >-
          uv run python .agents/skills/avo-roadmap/scripts/validate_roadmap.py
          docs/roadmap.md --max-review-age-days 45
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Build tier-separated evaluator images
        if: runner.os == 'Linux'
        run: |
          mkdir -p .avo-runtime
          docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.development --tag avo-reference-development:1.0.0 --metadata-file "$AVO_REFERENCE_DEVELOPMENT_METADATA_FILE" .
          docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.admission --tag avo-reference-admission:1.0.0 --metadata-file "$AVO_REFERENCE_ADMISSION_METADATA_FILE" .
      - name: Measure evaluator platform overhead
        if: runner.os == 'Linux'
        run: uv run avoctl platform benchmark
      - name: Run complete canonical suite with coverage
        if: runner.os == 'Linux'
        run: uv run pytest --cov=avo_correlate --cov-report=term
      - name: Run native Windows portability suite
        if: runner.os == 'Windows'
        run: >-
          uv run pytest
          --ignore tests/e2e/test_reference_scenario.py
          --ignore tests/integration/test_docker_evaluator.py
          --ignore tests/performance/test_platform_overhead.py
      - run: uv run python -m avo_correlate.devtools.export_schemas
      - name: Verify generated schemas are committed
        run: git diff --exit-code -- schemas

  windows-wsl-parity:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, Windows, X64, wsl2, docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify detached exact GitHub SHA in WSL
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace is not a clean checkout at GITHUB_SHA" }
      - name: Sync canonical WSL environment
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before sync" }
          wsl.exe --cd $wslProjectPath --exec uv sync --all-groups --all-extras --frozen
      - name: Build development evaluator in WSL
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before development build" }
          $metadataPath = "$wslProjectPath/.avo-runtime/ci-development-metadata.json"
          wsl.exe --cd $wslProjectPath --exec docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.development --metadata-file $metadataPath --tag avo-reference-development:1.0.0 .
      - name: Build admission evaluator in WSL
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before admission build" }
          $metadataPath = "$wslProjectPath/.avo-runtime/ci-admission-metadata.json"
          wsl.exe --cd $wslProjectPath --exec docker buildx build --output=type=docker --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --file evaluators/reference/Dockerfile.admission --metadata-file $metadataPath --tag avo-reference-admission:1.0.0 .
      - name: Measure WSL evaluator platform overhead
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before benchmark" }
          wsl.exe --cd $wslProjectPath --exec uv run avoctl platform benchmark
      - name: Run full parity and recovery suite through wrapper
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before parity tests" }
          wsl.exe --cd $wslProjectPath --exec uv run avoctl test parity
      - name: Run complete canonical suite
        shell: pwsh
        run: |
          $wslProjectPath = (wsl.exe wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $head = (wsl.exe --cd $wslProjectPath --exec git rev-parse HEAD).Trim()
          $status = (wsl.exe --cd $wslProjectPath --exec git status --porcelain).Trim()
          if ($head -ne $env:GITHUB_SHA -or $status) { throw "WSL workspace changed before canonical tests" }
          wsl.exe --cd $wslProjectPath --exec uv run pytest --cov=avo_correlate --cov-report=term
